# Production stack cho VPS (single instance).
#
# Khác docker-compose.yml ở gốc repo — file đó là infra cho dev local:
# password hardcode, publish port ra 0.0.0.0, có MinIO. File này:
#   - Lấy toàn bộ secret từ /opt/masoi/.env (chmod 600), không hardcode.
#   - Postgres/Redis KHÔNG publish ra Internet; chỉ bind 127.0.0.1 để admin.
#   - Không có MinIO: avatar dùng Cloudflare R2, vì
#     OBJECT_STORAGE_PUBLIC_BASE_URL bắt buộc HTTPS ở production
#     (apps/server/src/storage/config.ts) và tự host MinIO có HTTPS thì cần
#     thêm một domain + cert nữa, trên máy 2GB RAM là không đáng.
#
# Dùng: docker compose -f deploy/docker-compose.prod.yml --env-file /opt/masoi/.env up -d

name: masoi

services:
  postgres:
    image: postgres:16-alpine
    container_name: masoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt trong /opt/masoi/.env}
      POSTGRES_DB: masoi
    # Chỉ loopback. Không bao giờ để "5433:5432" — Docker tự chọc thủng UFW.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - masoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masoi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: masoi-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - masoi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: masoi-server:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: masoi-server
    restart: unless-stopped
    env_file:
      - /opt/masoi/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Container lắng nghe PORT (4100 trong .env). Nginx ở host proxy vào đây.
    ports:
      - "127.0.0.1:4100:4100"
    # Room state nằm trong RAM, Redis chỉ là bản sao để phục hồi — chạy nhiều
    # replica sẽ làm người chơi cùng phòng rơi vào các tiến trình khác nhau.
    deploy:
      replicas: 1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: masoi-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        # Nướng vào bundle lúc build. Web và API cùng origin nên đây chính là
        # origin công khai của trang. Đổi giá trị này BẮT BUỘC build lại image.
        NEXT_PUBLIC_SERVER_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN chưa đặt trong /opt/masoi/.env}
    container_name: masoi-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  masoi_pgdata:
  masoi_redisdata:
