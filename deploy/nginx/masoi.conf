# /etc/nginx/sites-available/masoi
#
# Topology "VPS chạy hết": web và API dùng CHUNG một origin, nên không còn
# chuyện CORS giữa hai bên.
#
#   http(s)://<domain>
#        ├─ /api/*        -> masoi-server :4100
#        ├─ /socket.io/*  -> masoi-server :4100  (WebSocket)
#        └─ /*            -> masoi-web    :3000
#
# Cài:
#   sed 's/THAY_BANG_DOMAIN/masoi.duckdns.org/' deploy/nginx/masoi.conf \
#       > /etc/nginx/sites-available/masoi
#   ln -sf /etc/nginx/sites-available/masoi /etc/nginx/sites-enabled/masoi
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d masoi.duckdns.org

limit_req_zone $binary_remote_addr zone=masoi_signup:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name THAY_BANG_DOMAIN;

    # Avatar upload. Mặc định 1m là ảnh vừa phải cũng 413.
    client_max_body_size 5m;

    # ---------------------------------------------------------------- API
    location /api/players {
        limit_req zone=masoi_signup burst=5 nodelay;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/snippets/masoi-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/snippets/masoi-proxy.conf;
    }

    # ---------------------------------------------------------- Socket.IO
    # Ván đấu kéo dài hàng chục phút; mặc định 60s sẽ cắt giữa chừng.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/snippets/masoi-proxy.conf;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------- Web
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/masoi-proxy.conf;

        # Next.js dev-overlay và HMR không có ở production, nhưng App Router
        # dùng streaming SSR — tắt buffering để trang hiện dần thay vì đợi hết.
        proxy_buffering off;
    }
}
