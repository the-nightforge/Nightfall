services:
  postgres:
    image: postgres:16-alpine
    container_name: masoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masoi
      POSTGRES_PASSWORD: masoi_dev_password
      POSTGRES_DB: masoi
    ports:
      - "5433:5432"
    volumes:
      - masoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masoi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: masoi-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - masoi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: masoi-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: masoi
      MINIO_ROOT_PASSWORD: masoi_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - masoi_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tạo bucket và mở quyền đọc công khai. Chạy một lần rồi thoát - avatar phải
  # đọc được từ thẻ <img> mà không cần chữ ký, y như bucket public trên R2.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: masoi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 masoi masoi_dev_password &&
      mc mb --ignore-existing local/masoi-avatars &&
      mc anonymous set download local/masoi-avatars
      "

volumes:
  masoi_pgdata:
  masoi_redisdata:
  masoi_miniodata:
