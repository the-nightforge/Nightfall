name: Keep server awake

# Render gói miễn phí cho máy chủ ngủ sau chừng 15 phút vắng người; lần gọi
# đầu sau đó treo 30-60 giây. Một cú GET /api/health mỗi 10 phút giữ nó thức.
#
# Hai điều cần biết trước khi sửa:
#   - GitHub chạy cron "khi rảnh", có thể trễ vài phút. 10 phút chọn để trễ
#     vài phút vẫn dưới ngưỡng ngủ.
#   - Render Free có hạn 750 giờ mỗi tháng cho cả tài khoản. Một dịch vụ chạy
#     liên tục là 744 giờ - vừa đủ cho ĐÚNG MỘT dịch vụ. Tắt workflow này ở
#     Actions nếu tài khoản còn dịch vụ Free nào khác.
#
# Health URL có thể đổi qua biến repo `HEALTH_URL` (Settings → Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://ma-soi-server-xzhv.onrender.com/api/health' }}
        run: |
          # --max-time đủ rộng cho một lần thức dậy trọn vẹn; thất bại chỉ ghi
          # log chứ không đỏ cả lịch chạy - đây là gõ cửa, không phải kiểm tra.
          curl --silent --show-error --max-time 90 --output /dev/null \
            --write-out "status=%{http_code} time=%{time_total}s\n" "$HEALTH_URL" || true
