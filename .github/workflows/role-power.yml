name: Role power sweep

# GỌI TAY, không chạy theo push/PR.
#
# Một lượt đầy đủ 300 ván tốn khoảng 23 giờ CPU, chia thành 15 shard chạy song
# song. Buộc nó vào mỗi PR nghĩa là một lỗi đánh máy trong `weights.ts` cũng kéo
# cả sweep. Bấm chạy khi vừa đổi trọng số, đổi luật, hoặc trước khi chốt lại
# `ROLE_POWER`.
on:
  workflow_dispatch:
    inputs:
      games:
        description: Số ván mỗi ô đo (300 cho số chốt, 30 để thử đường ống)
        required: true
        default: "300"

# Hai lượt sweep cùng lúc chỉ tổ tranh runner của nhau.
concurrency:
  group: role-power-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Trần cứng của GitHub là 6 giờ; để 5.5 để job bị treo chết có tiếng động
    # thay vì bị cắt ngang không lời giải thích.
    timeout-minutes: 330

    strategy:
      # Một shard hỏng không được kéo theo 14 shard còn lại - bước gộp sẽ tự
      # nói ra là thiếu preset nào.
      fail-fast: false
      matrix:
        include:
          # Chia cân theo chi phí ĐO ĐƯỢC, không theo dải preset: giá mỗi lượt
          # tăng gần bậc 3.5 theo số người (đo trên 3 luồng cục bộ, 2026-09-07),
          # nên preset 20 một mình đắt hơn cả cụm 8-12 cộng lại.
          #
          # Preset lớn còn cắt tiếp theo chiều VAI. Mỗi lát phải chạy lại nền để
          # có mốc trừ - đó là cái giá mua lấy tính song song. Vai không có
          # trong preset thì script tự bỏ qua, nên danh sách vai ở đây không cần
          # khớp thành phần từng preset.
          - { id: "01", args: "--only 8 --only 9 --only 10 --only 11 --only 12" }
          - { id: "02", args: "--only 13 --only 14" }
          - { id: "03", args: "--only 15" }
          - { id: "04", args: "--only 16" }

          - { id: "05", args: "--only 17 --role SEER --role GUARD --role WITCH --role HUNTER --role CURSED --role WOLF_CUB --role APPRENTICE_SEER" }
          - { id: "06", args: "--only 17 --role DETECTIVE --role TRACKER --role MAYOR --role ELDER --role SORCERER --role ALPHA_WOLF --role DOPPELGANGER" }

          - { id: "07", args: "--only 18 --role SEER --role GUARD --role WITCH --role HUNTER --role CURSED --role WOLF_CUB --role APPRENTICE_SEER" }
          - { id: "08", args: "--only 18 --role DETECTIVE --role TRACKER --role MAYOR --role ELDER --role SORCERER --role ALPHA_WOLF --role DOPPELGANGER" }

          - { id: "09", args: "--only 19 --role SEER --role GUARD --role WITCH --role HUNTER --role CURSED" }
          - { id: "10", args: "--only 19 --role WOLF_CUB --role APPRENTICE_SEER --role DETECTIVE --role TRACKER --role MAYOR" }
          - { id: "11", args: "--only 19 --role ELDER --role SORCERER --role ALPHA_WOLF --role DOPPELGANGER" }

          - { id: "12", args: "--only 20 --role SEER --role GUARD --role WITCH --role HUNTER" }
          - { id: "13", args: "--only 20 --role CURSED --role WOLF_CUB --role APPRENTICE_SEER" }
          - { id: "14", args: "--only 20 --role DETECTIVE --role TRACKER --role MAYOR --role ELDER" }
          - { id: "15", args: "--only 20 --role SORCERER --role ALPHA_WOLF --role DOPPELGANGER" }

    env:
      # `prisma generate` chạy trong postinstall và chỉ đọc schema, nhưng
      # datasource khai báo `env("DATABASE_URL")` nên biến phải TỒN TẠI. Không
      # job nào ở đây chạm database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build deps
        # `role-power.ts` import `@masoi/game-engine` tức là đọc `dist/`. Bỏ
        # bước này thì sweep đo bằng code cũ mà không có lỗi nào để lần theo.
        run: npm run build:deps

      - name: Sweep
        run: npx tsx apps/server/scripts/role-power.ts --json --games ${{ inputs.games }} ${{ matrix.args }} > shard-${{ matrix.id }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: role-power-${{ matrix.id }}
          path: shard-${{ matrix.id }}.json
          retention-days: 14

  merge:
    needs: sweep
    # Chạy cả khi có shard đỏ: một bảng thiếu vài preset vẫn hơn không có gì,
    # và số mẫu ở cột cuối nói ra chỗ thiếu.
    if: always()
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build deps
        run: npm run build:deps

      - uses: actions/download-artifact@v4
        with:
          pattern: role-power-*
          path: shards

      - name: Merge
        # Bảng đi thẳng vào trang tổng kết của lần chạy, đọc được ngay mà không
        # phải tải artifact về.
        run: npx tsx apps/server/scripts/role-power-merge.ts shards | tee role-power.md

      - uses: actions/upload-artifact@v4
        with:
          name: role-power-report
          path: role-power.md
          retention-days: 90
