name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  # Cho chạy tay khi job nặng bị skip do lọc path (ví dụ deploy lại sau khi fix infra).
  workflow_dispatch:

# Push liên tiếp lên cùng một nhánh thì chỉ lần cuối đáng chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Repo này CÔNG KHAI, nên workflow chạy được từ PR của người lạ. Không job nào ở
# đây cần quyền ghi: đặt trần read ở cấp workflow để token của một PR fork không
# đẩy commit, sửa release hay bình luận thay mình được.
permissions:
  contents: read

jobs:
  # Lọc path MỘT lần để job nặng (e2e, docker) chỉ chạy khi backend/docker đổi.
  # Commit chỉ sửa apps/web/** sẽ skip 2 job này -> tiết kiệm ~10-20 phút Actions/run.
  # Chạy tay (workflow_dispatch) thì luôn chạy đủ để kiểm toàn diện.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      docker: ${{ steps.filter.outputs.docker }}
      training: ${{ steps.filter.outputs.training }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'packages/game-engine/**'
              - 'package.json'
              - 'package-lock.json'
            docker:
              - 'Dockerfile.server'
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'packages/game-engine/**'
              - 'package.json'
              - 'package-lock.json'
            training:
              - 'ai-training/**'
              - '.github/workflows/ci.yml'

  verify:
    runs-on: ubuntu-latest

    env:
      # `prisma generate` chỉ đọc schema, không kết nối. Nhưng datasource khai
      # báo `env("DATABASE_URL")` nên biến phải TỒN TẠI. Đây là giá trị giả và
      # không có database nào ở đầu kia - không job nào ở đây chạm tới DB thật.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # KHÔNG còn khớp với node:20.19-alpine của Dockerfile.server, và đó là
          # một đánh đổi có ý thức chứ không phải sơ suất.
          #
          # `TrialStage.test.tsx` mount cây React thật và dùng module mocking của
          # `node:test` - thứ còn đang thực nghiệm và hành xử khác nhau theo bản:
          #
          #   20.19  `mock.module` chưa có tuỳ chọn `exports`, và bỏ qua nó LẶNG
          #          LẼ; mock cài vào một module rỗng.
          #   22.x   mock module cục bộ nạp bằng `import()` động KHÔNG ăn (module
          #          thật vẫn chạy), trong khi specifier trần như `three` thì ăn.
          #          Đã đo trên cả Windows lẫn container linux: 931/937.
          #   24.x   cả hai đều đúng: 937/937, đo trên Windows và trên
          #          node:24-alpine.
          #
          # Nên đây là phiên bản THẤP NHẤT chạy được bộ test này, không phải một
          # lựa chọn cho mới. Mã server không có phần nào phụ thuộc phiên bản,
          # còn bộ test thì có.
          #
          # Nếu sau này muốn khớp lại: nâng Dockerfile.server lên node:24-alpine
          # cùng lúc, đừng hạ dòng này xuống một mình.
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        # `tsc` trên apps/server cần type của @prisma/client. Hook postinstall
        # của @prisma/client thường lo việc này, nhưng gọi thẳng thì lỗi hiện ra
        # ở đúng bước của nó thay vì thành một lỗi type khó hiểu ở bước sau.
        run: npm run db:generate

      - name: Build
        # PHẢI chạy trước test và lint. `@masoi/shared` và `@masoi/game-engine`
        # trỏ main/types vào `dist/`, mà `dist/` nằm trong .gitignore - checkout
        # sạch thì hai package đó chưa tồn tại dưới dạng mà workspace khác import
        # được. Bỏ bước này thì test server/web đỏ hàng loạt vì "has no exported
        # member", chứ không phải vì code sai.
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  # Tầng train Python (ai-training/). Không có luật game ở đây, chỉ có loader
  # nhị phân và vòng train; nhưng `train_bc.py` từng được merge mà chưa chạy
  # lần nào vì máy dev không có torch. Job này là chỗ nó PHẢI chạy: loader tự
  # kiểm, rồi một vòng train 2 epoch trên dataset tổng hợp, với torch CPU thật.
  # Chỉ chạy khi ai-training/** đổi - wheel torch CPU nặng ~200 MB.
  ai-training:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-training

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-training/requirements.txt

      - name: Install (torch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Loader self-check
        run: python tests/test_data.py

      - name: Behavior cloning smoke (torch thật)
        run: python tests/test_train_smoke.py

  # Ván khói thật: 8 socket chơi trọn một ván tới GAME_OVER, rồi kịch bản khôi
  # phục SIGKILL server giữa ván và kiểm ván sống lại từ Redis. Cả hai cần
  # Postgres + Redis thật - unit test không thay được, vì bug đã gặp nhiều lần
  # nằm ở khớp nối (persist, resume, auth socket) chứ không ở từng hàm.
  #
  # Chạy song song với `verify` để không cộng dồn thời gian; deploy-production
  # chờ cả ba (xem bên dưới).
  e2e:
    needs: changes
    # Chỉ chạy khi backend đổi. Sửa mỗi apps/web/** thì skip -> tiết kiệm phút.
    # Chạy tay luôn chạy để kiểm toàn diện.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masoi
          POSTGRES_PASSWORD: masoi
          POSTGRES_DB: masoi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masoi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://masoi:masoi@localhost:5432/masoi
      REDIS_URL: redis://localhost:6379
      # Bot chơi ngẫu nhiên: CI không có khoá nhà cung cấp và cũng không nên có.
      BOT_AI_ENABLED: "false"
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build server
        run: npm run build:shared && npm run build:engine && npm run build:server

      - name: Migrate database
        run: npm run db:migrate

      - name: Start server
        # Chạy đúng artefact production (dist/), không phải tsx - cùng thứ mà
        # Dockerfile.server đóng gói. Log ra file để bước "Server log" in lại
        # khi ván khói đỏ; không có nó thì chỉ thấy "Timeout chờ phase".
        run: |
          PORT=4100 node apps/server/dist/index.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:4100/api/health > /dev/null; then
              echo "server sẵn sàng sau ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server không lên sau 30s"; cat server.log; exit 1

      - name: Smoke game (8 sockets → GAME_OVER)
        run: npm run test:e2e
        env:
          SERVER_URL: http://localhost:4100

      - name: Crash recovery (SIGKILL giữa ván)
        # Kịch bản này tự spawn và tự giết server của nó ở cổng 4155; server
        # 4100 ở trên không dính dáng.
        run: npm run test:e2e:recovery

      - name: Server log
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  # Render build image này từ Dockerfile.server và KHÔNG chạy qua CI, nên một
  # Dockerfile hỏng chỉ lộ ra ở Render - sau khi Vercel đã ship frontend mới.
  # Frontend đọc trường mà backend mới phải cấp; web mới + server cũ là kiểu
  # hỏng lặng lẽ nhất của repo này. Build thử ở đây để chặn nó trước deploy.
  docker-server:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
          # Cache layer npm ci giữa các lần chạy; build sạch mất ~4 phút, có
          # cache thì ~1 phút khi package-lock không đổi.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vercel Hobby chỉ cho deploy commit mà git author là chủ account. Commit của
  # người khác không "fail" - deployment vào thẳng trạng thái BLOCKED, bỏ qua
  # build, và `vercel deploy` không coi BLOCKED là trạng thái kết thúc nên nó
  # chờ vô hạn. VERCEL_TOKEN KHÔNG cứu được: Vercel xét metadata git mà CLI đọc
  # từ cây làm việc, không xét chủ sở hữu token. Xem bước "Stage source" bên
  # dưới để biết cách đi vòng.
  #
  # `git.deploymentEnabled: false` trong vercel.json đã tắt auto-deploy của Git
  # integration - nếu bật lại thì mỗi commit sẽ deploy hai lần.
  #
  # Cần ba secrets ở repo: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  # Build vẫn chạy trên hạ tầng Vercel với env vars của project, ở đây chỉ upload
  # source rồi chờ kết quả.

  deploy-preview:
    needs: verify
    # PR từ fork KHÔNG được cấp secrets (GitHub cố ý), nên job này ở đó chỉ có
    # thể đỏ với token rỗng. Nó cũng không nên chạy: deploy preview một PR lạ là
    # đem mã của người ngoài lên hạ tầng Vercel của mình. Chỉ PR mở từ nhánh
    # trong chính repo này mới được preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Build của project này mất ~35s và Vercel cắt mọi build ở 45 phút, nên bất
    # cứ thứ gì vượt mốc dưới đây là hỏng chứ không phải chậm. Không có dòng này
    # thì job treo đủ 6 tiếng theo mặc định của GitHub.
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install Vercel CLI
        run: npm i -g vercel@59

      # CLI đọc .git của cây làm việc rồi đính kèm tác giả commit vào deployment;
      # đó chính là thứ khiến Vercel Hobby chặn commit của người ngoài. `git
      # archive` cho ra đúng cây file của commit này mà không kèm .git, nên CLI
      # không có tác giả nào để đính kèm và không còn gì để chặn.
      #
      # Deploy từ thư mục khác thay vì xoá .git tại chỗ, để bước post của
      # actions/checkout vẫn còn repo mà dọn credentials.
      - name: Stage source without git metadata
        run: |
          mkdir -p /tmp/deploy
          git archive --format=tar HEAD | tar -x -C /tmp/deploy

      - name: Deploy preview
        working-directory: /tmp/deploy
        # --archive=tgz gửi một file nén thay vì vài nghìn file lẻ; monorepo này
        # đủ lớn để cách upload từng file hay bị chậm và timeout.
        #
        # --logs đẩy log build của Vercel ra stderr; thiếu nó thì step chỉ in
        # "Building…" rồi im lặng và không ai biết build đang ở đâu. stdout vẫn
        # chỉ có mỗi URL nên $(...) dưới đây không bị lẫn log.
        run: |
          url=$(vercel deploy --archive=tgz --yes --logs --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    # Chờ cả ván khói lẫn build Docker: Vercel ship web trong khi Render không
    # build nổi image mới là kiểu hỏng lặng lẽ đã ghi ở docker-server. Preview
    # thì chỉ cần verify - đó là tiện ích cho PR, không phải cổng ra production.
    # e2e/docker có thể `skipped` khi chỉ sửa web -> vẫn cho deploy (always() +
    # kiểm result từng job). Không dùng `always()` thì deploy bị skip theo.
    needs: [verify, e2e, docker-server]
    if: always() && github.event_name == 'push' && needs.verify.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') && (needs.docker-server.result == 'success' || needs.docker-server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install Vercel CLI
        run: npm i -g vercel@59

      # Xem giải thích ở job deploy-preview.
      - name: Stage source without git metadata
        run: |
          mkdir -p /tmp/deploy
          git archive --format=tar HEAD | tar -x -C /tmp/deploy

      - name: Deploy production
        working-directory: /tmp/deploy
        run: |
          url=$(vercel deploy --prod --archive=tgz --yes --logs --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
