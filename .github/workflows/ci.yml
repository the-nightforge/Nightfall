name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp lên cùng một nhánh thì chỉ lần cuối đáng chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # `prisma generate` chỉ đọc schema, không kết nối. Nhưng datasource khai
      # báo `env("DATABASE_URL")` nên biến phải TỒN TẠI. Đây là giá trị giả và
      # không có database nào ở đầu kia - không job nào ở đây chạm tới DB thật.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # KHÔNG còn khớp với node:20.19-alpine của Dockerfile.server, và đó là
          # một đánh đổi có ý thức chứ không phải sơ suất.
          #
          # `TrialStage.test.tsx` mount cây React thật và dùng module mocking của
          # `node:test` - thứ vừa mới có từ v20.18.0 và còn đang thực nghiệm.
          # Suite web đỏ trên runner 20.19 kể từ khi file đó vào repo, trong khi
          # cùng bộ test xanh 937/937 trên 22.x. Chạy test ở đúng phiên bản mà
          # người phát triển chạy đáng giá hơn là chạy ở phiên bản của image
          # server - mã server không có phần nào phụ thuộc phiên bản, còn bộ test
          # thì có.
          #
          # Nếu sau này muốn khớp lại: nâng Dockerfile.server lên node:22-alpine
          # cùng lúc, đừng hạ dòng này xuống một mình.
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        # `tsc` trên apps/server cần type của @prisma/client. Hook postinstall
        # của @prisma/client thường lo việc này, nhưng gọi thẳng thì lỗi hiện ra
        # ở đúng bước của nó thay vì thành một lỗi type khó hiểu ở bước sau.
        run: npm run db:generate

      - name: Build
        # PHẢI chạy trước test và lint. `@masoi/shared` và `@masoi/game-engine`
        # trỏ main/types vào `dist/`, mà `dist/` nằm trong .gitignore - checkout
        # sạch thì hai package đó chưa tồn tại dưới dạng mà workspace khác import
        # được. Bỏ bước này thì test server/web đỏ hàng loạt vì "has no exported
        # member", chứ không phải vì code sai.
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  # Vercel Hobby chỉ cho deploy commit mà git author là chủ account. Commit của
  # người khác không "fail" - deployment vào thẳng trạng thái BLOCKED, bỏ qua
  # build, và `vercel deploy` không coi BLOCKED là trạng thái kết thúc nên nó
  # chờ vô hạn. VERCEL_TOKEN KHÔNG cứu được: Vercel xét metadata git mà CLI đọc
  # từ cây làm việc, không xét chủ sở hữu token. Xem bước "Stage source" bên
  # dưới để biết cách đi vòng.
  #
  # `git.deploymentEnabled: false` trong vercel.json đã tắt auto-deploy của Git
  # integration - nếu bật lại thì mỗi commit sẽ deploy hai lần.
  #
  # Cần ba secrets ở repo: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  # Build vẫn chạy trên hạ tầng Vercel với env vars của project, ở đây chỉ upload
  # source rồi chờ kết quả.

  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Build của project này mất ~35s và Vercel cắt mọi build ở 45 phút, nên bất
    # cứ thứ gì vượt mốc dưới đây là hỏng chứ không phải chậm. Không có dòng này
    # thì job treo đủ 6 tiếng theo mặc định của GitHub.
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install Vercel CLI
        run: npm i -g vercel@59

      # CLI đọc .git của cây làm việc rồi đính kèm tác giả commit vào deployment;
      # đó chính là thứ khiến Vercel Hobby chặn commit của người ngoài. `git
      # archive` cho ra đúng cây file của commit này mà không kèm .git, nên CLI
      # không có tác giả nào để đính kèm và không còn gì để chặn.
      #
      # Deploy từ thư mục khác thay vì xoá .git tại chỗ, để bước post của
      # actions/checkout vẫn còn repo mà dọn credentials.
      - name: Stage source without git metadata
        run: |
          mkdir -p /tmp/deploy
          git archive --format=tar HEAD | tar -x -C /tmp/deploy

      - name: Deploy preview
        working-directory: /tmp/deploy
        # --archive=tgz gửi một file nén thay vì vài nghìn file lẻ; monorepo này
        # đủ lớn để cách upload từng file hay bị chậm và timeout.
        #
        # --logs đẩy log build của Vercel ra stderr; thiếu nó thì step chỉ in
        # "Building…" rồi im lặng và không ai biết build đang ở đâu. stdout vẫn
        # chỉ có mỗi URL nên $(...) dưới đây không bị lẫn log.
        run: |
          url=$(vercel deploy --archive=tgz --yes --logs --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x

      - name: Install Vercel CLI
        run: npm i -g vercel@59

      # Xem giải thích ở job deploy-preview.
      - name: Stage source without git metadata
        run: |
          mkdir -p /tmp/deploy
          git archive --format=tar HEAD | tar -x -C /tmp/deploy

      - name: Deploy production
        working-directory: /tmp/deploy
        run: |
          url=$(vercel deploy --prod --archive=tgz --yes --logs --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
